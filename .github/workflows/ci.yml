name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      # Unit gate: zero key / zero browser. Real-integration tests (marked
      # `real`) and e2e smoke are deselected here; the real-smoke workflow
      # covers them.
      - name: Run tests with coverage (unit only)
        run: >
          pytest -m "not e2e and not real"
          --cov=app
          --cov-report=term-missing

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
