[project]
name = "ai-test-workflow-backend"
version = "0.1.0"
description = "AI Test Workflow Automation — FastAPI backend (Phase 10: complete)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not e2e and not real\""
python_files = ["test_*.py"]
markers = [
    "e2e: end-to-end smoke (real browser / live demo API, env-gated; excluded by default)",
    "real: real DeepSeek / real browser integration (env-gated; excluded by default, P013)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

# FastAPI dependency-injection pattern: Depends/Query/Header/... calls in
# argument defaults are intentional (not side effects).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
]
