services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testworkflow
      POSTGRES_PASSWORD: testworkflow
      POSTGRES_DB: ai_test_workflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testworkflow -d ai_test_workflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://testworkflow:testworkflow@db:5432/ai_test_workflow
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LOG_LEVEL: INFO
      LLM_API_KEY: ${LLM_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/app/artifacts

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  artifacts:
